version: '3'

# Parameters:
# -------------
#   - APP:      osd (OpenSearch Dashboards) or kbn (Kibana)
#   - VERSION:  OpenSearch Dashboards / Kibana version
#   - REPO:     Path to the Wazuh app local repository
#   - CMD:      yarn command to execute in the container
#   - ARGS:     (optional) Additional CLI options of the command

services:
  test_runner:
    container_name: runner
    image: quay.io/wazuh/$APP-dev:$VERSION
    working_dir: /home/node/kbn/plugins/wazuh
    environment:
      GIT_REF: ${GIT_REF:-}
      INDEXER_TEMPLATE_ROOT: ${INDEXER_TEMPLATE_ROOT:-}
      SKIP_DOWNLOAD_INDEXER_RESOURCES: ${SKIP_DOWNLOAD_INDEXER_RESOURCES:-}
    volumes:
      - $REPO:/home/node/kbn/plugins/wazuh
      - ${INDEXER_TEMPLATE_HOST_ROOT:-/opt/OWNHIDS/wazuh-indexer-5.0.0-beta1/repositories/wazuh-indexer-plugins}:${INDEXER_TEMPLATE_ROOT:-/opt/OWNHIDS/wazuh-indexer-5.0.0-beta1/repositories/wazuh-indexer-plugins}:ro
    tty: true
    command: /bin/bash -c '
      yarn;
      yarn $CMD $ARGS
      '
